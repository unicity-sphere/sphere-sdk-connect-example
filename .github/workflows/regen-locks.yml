# TEMPORARY — removed before this PR merges.
#
# This repo's five package-lock.json files have to be regenerated by npm itself
# for an SDK bump this large (0.14.2 -> 0.17.6 moves transitive deps), and the
# machine the bump was authored on has no npm. This job runs the install on a
# runner and publishes the resulting lockfiles as an artifact, which is then
# committed to the branch. CI's `npm ci` is what actually validates them.
name: Regenerate lockfiles (temporary)

on:
  push:
    branches: [chore/sdk-0.17.2-and-mint-nft]

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install in every package
        run: |
          set -e
          for dir in browser nodejs bot backend-auth/frontend backend-auth/backend; do
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund)
            echo "::endgroup::"
          done
      - name: Prove npm ci accepts the regenerated lockfiles
        run: |
          set -e
          for dir in browser nodejs bot backend-auth/frontend backend-auth/backend; do
            echo "::group::npm ci $dir"
            (cd "$dir" && rm -rf node_modules && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: package-locks
          path: |
            browser/package-lock.json
            nodejs/package-lock.json
            bot/package-lock.json
            backend-auth/frontend/package-lock.json
            backend-auth/backend/package-lock.json
