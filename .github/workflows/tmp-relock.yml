# TEMPORARY — delete in the same commit that lands the lockfile it produces.
#
# This repository is developed on a machine with no npm, so a lockfile cannot be regenerated
# there. Hand-editing one is only safe while the dependency tree does not change; sphere-ui
# 0.1.45 adds react-markdown, remark-gfm and remark-breaks, whose transitive trees run to dozens
# of packages. So the runner does the install and hands the result back as an artifact.
#
# It also runs the checks, which is half the point: the browser tests were edited for 0.1.45's
# CustomSelect — its rows became options and its trigger a combobox — and that edit cannot be
# verified anywhere else, since extracting the tarball locally dies on the three packages above.
name: tmp relock browser

on: push

jobs:
  relock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, writing a fresh lockfile
        run: npm install

      - name: Show what moved
        run: node -p "'sphere-ui ' + require('./node_modules/@unicitylabs/sphere-ui/package.json').version + ' / sdk ' + require('./node_modules/@unicitylabs/sphere-sdk/package.json').version"

      - name: Type check
        run: npx tsc -b --force

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-lockfile
          path: browser/package-lock.json
